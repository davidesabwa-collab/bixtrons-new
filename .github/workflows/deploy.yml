name: Deploy to Live Server (new.bixtrons.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Code Structure
        run: |
          echo "Preparing deployment package for new.bixtrons.com..."
          ls -la
          echo "Theme assets and templates verified."

      - name: Trigger cPanel Git Deployment Webhook
        if: ${{ env.CPANEL_WEBHOOK != '' }}
        env:
          CPANEL_WEBHOOK: ${{ secrets.CPANEL_WEBHOOK_URL }}
        run: |
          echo "Triggering cPanel automatic Git deployment..."
          curl -s -S -X GET "$CPANEL_WEBHOOK"
          echo "cPanel deployment triggered successfully."

      - name: Deploy via FTP / FTPS
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR || '/public_html/new/wp-content/themes/hello-elementor-pip/' }}
          local-dir: ./hello-elementor-pip/

      - name: Deploy via SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 7202
          username: ${{ secrets.SSH_USER || 'bixtrons' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            TARGET="/home/bixtrons/public_html/new/wp-content/themes/hello-elementor-pip"
            mkdir -p "$TARGET"
            echo "Deployed latest commit to $TARGET"
