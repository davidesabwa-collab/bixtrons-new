name: Instant Automated Deployment to new.bixtrons.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Theme Code
        run: |
          echo "Packaging theme code (templates, stylesheets, scripts, fonts)..."
          zip -r -q theme.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.sql*" \
            -x "*.py" \
            -x "*.zip" \
            -x "*.gz" \
            -x "*.log" \
            -x "*.tmp" \
            -x "node_modules/*" \
            -x "assets/images/*" \
            -x "hello-elementor-pip/assets/images/*"
          echo "Theme package size: $(ls -lh theme.zip | awk '{print $5}')"

      - name: Deploy Instantly to new.bixtrons.com
        run: |
          echo "Deploying to https://new.bixtrons.com/auto_deploy.php ..."
          RESPONSE=$(curl -f -s -S -X POST "https://new.bixtrons.com/auto_deploy.php" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @theme.zip)
          echo "Server response: $RESPONSE"

      - name: Purge Cloudflare Cache
        run: |
          echo "Purging Cloudflare edge cache..."
          CF_RES=$(curl -f -s -S -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare response: $CF_RES"

      - name: Live Smoke Test
        run: |
          echo "Verifying live site status..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://new.bixtrons.com/")
          echo "Live HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment verification failed with status $STATUS"
            exit 1
          fi
          echo "Deployment verified successfully! Live at https://new.bixtrons.com/"
