name: Instant Automated Deployment to new.bixtrons.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: PHP Lint (block deploy on syntax errors)
        run: |
          FAIL=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || FAIL=1
          done < <(find . -name "*.php" -not -path "./.git/*")
          if [ "$FAIL" -ne 0 ]; then
            echo "PHP syntax error found. Aborting deploy."
            exit 1
          fi
          echo "All PHP files passed lint."

      - name: Stamp build id (asset cache-busting + page cache key)
        run: |
          BUILD="${GITHUB_SHA::10}"
          printf "<?php\n/** Build identifier: set by the deploy workflow (git commit SHA). */\nif ( ! defined( 'BX_BUILD' ) ) {\n    define( 'BX_BUILD', '%s' );\n}\n" "$BUILD" > inc/build.php
          echo "Build id: $BUILD"

      - name: Package Theme Code
        run: |
          echo "Packaging theme code (templates, stylesheets, scripts, fonts)..."
          zip -r -q theme.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tools/*" \
            -x "dropins/*" \
            -x "README.md" \
            -x "agent_deployment_instructions.md" \
            -x "wp-config-sample-live.php" \
            -x "*.sql*" \
            -x "*.py" \
            -x "*.zip" \
            -x "*.gz" \
            -x "*.log" \
            -x "*.tmp" \
            -x "node_modules/*" \
            -x ".impeccable/*" \
            -x ".playwright-mcp/*"
          echo "Theme package size: $(ls -lh theme.zip | awk '{print $5}')"

      - name: Deploy Instantly to new.bixtrons.com
        run: |
          echo "Deploying to https://new.bixtrons.com/auto_deploy.php ..."
          RESPONSE=$(curl -f -s -S -X POST "https://new.bixtrons.com/auto_deploy.php" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @theme.zip)
          echo "Server response: $RESPONSE"

      - name: Purge Cloudflare Cache
        run: |
          echo "Purging Cloudflare edge cache..."
          CF_RES=$(curl -f -s -S -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare response: $CF_RES"

      - name: Live Smoke Test
        run: |
          BASE=https://new.bixtrons.com
          FAIL=0
          for p in / /shop/ /about/ /contact/ /our-locations/; do
            S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BASE$p")
            echo "$p -> $S"
            [ "$S" = "200" ] || FAIL=1
          done
          curl -s --max-time 90 "$BASE/" | grep -q 'id="bx-fab"' || { echo "Chat widget missing on home page"; FAIL=1; }
          curl -s --max-time 90 "$BASE/contact/" | grep -q 'id="bx-chat-inline"' || { echo "Chat missing on contact page"; FAIL=1; }
          if [ "$FAIL" -ne 0 ]; then
            echo "Deployment verification failed"
            exit 1
          fi
          echo "Deployment verified successfully! Live at $BASE/"

      - name: Warm page cache (key pages, categories, products)
        continue-on-error: true
        run: |
          BASE=https://new.bixtrons.com
          {
            for p in / /about/ /contact/ /our-locations/ /quality-certifications/ /legal/ /shop/; do echo "$BASE$p"; done
            curl -s --max-time 90 "$BASE/wp-json/wc/store/v1/products/categories?per_page=100" | grep -o '"permalink":"[^"]*"' | sed 's/"permalink":"//; s/"$//; s#\\/#/#g'
            for pg in 1 2 3; do
              curl -s --max-time 90 "$BASE/wp-json/wc/store/v1/products?per_page=100&page=$pg" | grep -o '"permalink":"[^"]*"' | sed 's/"permalink":"//; s/"$//; s#\\/#/#g'
            done
          } | sort -u > urls.txt
          echo "Warming $(wc -l < urls.txt) URLs..."
          timeout 600 xargs -P 6 -n 1 curl -s -o /dev/null --max-time 120 -w "%{http_code} %{time_total}s %{url_effective}\n" < urls.txt | sort | uniq -c -w4 | head -5
